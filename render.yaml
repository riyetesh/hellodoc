services:
  - type: web
    name: hellodoc-private-model
    runtime: python
    rootDir: Algo
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PREDICTION_INTERNAL_TOKEN
        sync: false

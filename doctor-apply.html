<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HelloDoc | Doctor application</title><link rel="icon" type="image/svg+xml" href="/Asset/favicon.svg"><link rel="stylesheet" href="/Styles/app.css?v=blue2"><link rel="stylesheet" href="/Styles/signup.css?v=blue2"></head>
<body><nav class="navbar" id="navbar"><div class="container navbar-inner"><a href="index.html" class="navbar-brand"><img src="/Asset/Login/hello-doc.png" alt="HelloDoc" class="logo"></a><ul class="nav-links" id="navLinks"><li><a href="index.html" class="nav-link">Home</a></li><li><a href="doctor-apply.html" class="nav-link">Doctor application</a></li></ul></div></nav>
<main class="container signup-card"><form class="signup-form" id="doctorApplication"><h1>Apply as a doctor</h1><p>First <a href="signup.html">create a patient account</a>, then <a href="index.html?login=doctor">sign in</a> to apply. A verified administrator must review your license before doctor access is granted. Applying does not grant doctor privileges.</p><div class="lower"><div class="form-grp"><label for="specialty">Specialty</label><input id="specialty" name="specialty" required minlength="2" maxlength="120"></div><div class="form-grp"><label for="licenseNumber">Professional license number</label><input id="licenseNumber" name="licenseNumber" required minlength="3" maxlength="120" autocomplete="off"></div><div class="form-grp"><label for="qualifications">Qualifications</label><textarea id="qualifications" name="qualifications" minlength="5" maxlength="2000" required></textarea></div><div class="form-grp"><label for="evidenceReference">Verification evidence reference</label><textarea id="evidenceReference" name="evidenceReference" minlength="5" maxlength="1000" required placeholder="Licensing registry reference or secure evidence location. Do not include patient information."></textarea></div><button class="btn btn-primary" type="submit">Submit application</button><p id="applicationMessage" role="status"></p></div></form></main><script src="/Scripts/doctor-apply.js"></script></body></html>

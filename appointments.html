<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Appointments — HelloDoc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./Styles/app.css" />
    <link rel="stylesheet" href="./Styles/appointments.css" />
  </head>

  <body>
    <!-- ===== Navbar ===== -->
    <nav class="navbar" id="navbar">
      <div class="container navbar-inner">
        <a href="index.html" class="navbar-brand">
          <img src="./images/Logo.png" alt="HelloDoc" class="logo" />
          <span>helloDoc</span>
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>

        <ul class="nav-links" id="navLinks">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="/predict" class="nav-link">Check symptoms</a></li>
          <li>
            <a href="appointments.html" class="nav-link active">
              Appointments
              <span class="nav-badge" data-appt-badge>0</span>
            </a>
          </li>
          <li><a href="help.html" class="nav-link">Help</a></li>
          <li><a href="team.html" class="nav-link">Team</a></li>
        </ul>

        <div class="navbar-actions" id="navActions">
          <a href="dashboard.html" class="btn btn-outline">
            <i class="fa-solid fa-user-doctor"></i> Find a doctor
          </a>
        </div>
      </div>
    </nav>

    <!-- ===== Header ===== -->
    <header class="page-head">
      <div class="container page-head-inner">
        <div>
          <h1>My Appointments</h1>
          <p>Manage your consultations and start a visit when it's time.</p>
        </div>
        <a href="dashboard.html" class="btn btn-primary">
          <i class="fa-solid fa-plus"></i> Book new
        </a>
      </div>
    </header>

    <!-- ===== Tabs ===== -->
    <div class="container tabs-wrap">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="upcoming">
          Upcoming <span class="tab-count" id="upcomingCount">0</span>
        </button>
        <button class="tab" data-tab="past">
          Past <span class="tab-count" id="pastCount">0</span>
        </button>
      </div>
    </div>

    <!-- ===== List ===== -->
    <main class="container appt-main">
      <div id="apptList" class="appt-list"></div>

      <div id="apptEmpty" class="appt-empty" hidden>
        <i class="fa-regular fa-calendar-xmark"></i>
        <h3 id="emptyTitle">No upcoming appointments</h3>
        <p id="emptyText">When you book a consultation, it will show up here.</p>
        <a href="dashboard.html" class="btn btn-primary">
          <i class="fa-solid fa-user-doctor"></i> Find a doctor
        </a>
      </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="./Scripts/doctors-data.js"></script>
    <script src="./Scripts/appointments.js"></script>
    <script src="./Scripts/appointments-page.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HelloDoc | Symptoms</title>
    <meta
      name="description"
      content="Pick the symptoms you are experiencing and get a preliminary suggestion of what they might point to, with precautions and general guidance. An experimental prototype, not a diagnosis."
    />


    <!-- Page styles first, so the shared app.css below wins any conflict. -->
    <link rel="stylesheet" href="../static/styles.css?v=blue2" />

    <!-- Shared site styles, fonts and icons — the same as every other page. -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../Styles/app.css?v=blue2" />
    <link rel="icon" type="image/svg+xml" href="/Asset/favicon.svg">
</head>
  <body>

    <!-- Shared site navbar: identical markup to every other page. -->
    <!-- ===== Shared navbar (canonical block) =====
         Identical items in the same order on every page. The current page is
         highlighted by Scripts/nav.js from the URL, so no page hard-codes an
         `active` class. The three story pages are distinct:
           About   - what HelloDoc is (home page section)
           My Story- why it was built (the personal account)
    -->
    <nav class="navbar" id="navbar">
      <div class="container navbar-inner">
        <a href="../../index.html" class="navbar-brand">
          <img src="../Asset/Login/hello-doc.png" alt="HelloDoc" class="logo" />
        </a>

        <ul class="nav-links" id="navLinks">
          <li><a href="../../index.html#about" class="nav-link">About</a></li>
          <li><a href="../../dashboard.html" class="nav-link">Find a doctor</a></li>

          <li>
            <a href="../../appointments.html" class="nav-link">
              Appointments
              <span class="nav-badge" data-appt-badge>0</span>
            </a>
          </li>
          <li><a href="../../story.html" class="nav-link">My Story</a></li>
          <li><a href="../../help.html" class="nav-link">Help</a></li>
        </ul>

        <div class="navbar-actions" id="navActions">
          <a href="../../index.html" class="btn btn-ghost" id="loginBtn">Log in</a>
          <a href="../../signup.html" class="btn btn-primary" id="signupBtn">Sign up</a>
          <button class="user-chip" id="userChip" hidden>
            <span class="avatar" id="userAvatar">U</span>
            <span class="user-name" id="userName">Guest</span>
            <i class="fas fa-chevron-down" style="font-size: 0.7rem; color: var(--muted)"></i>
          </button>
        </div>
      </div>
    </nav>


    <!-- Floating Chatbot Button -->
    <button class="chatbot-button" onclick="toggleChatbot()">🤖</button>

    <!-- Chatbot Container -->
    <div class="chatbot-container" id="chatbotContainer">
      <iframe
        class="chatbot-iframe"
        src="https://bijayrauniyar-hello-doc.vercel.app/"
      ></iframe>
    </div>

   

        

    <div class="container-wrapper">
      <div class="content">
        <img
          src="../Asset/Illustrations/care.svg"
          alt=""
          class="leftmain"
        />
        <div class="form-container">
          <!-- novalidate hands validation to Scripts/form-validation.js, which
               shows each problem beside the field with an explanation. -->
          <form action="/predict" method="post" novalidate>
            <div class="form-group">
              <label for="symptoms">Select Symptoms</label>
              <div class="tags-container" id="tagsContainer">
                <input
                  type="text"
                  id="symptomsInput"
                  class="tag-input"
                  placeholder="Type symptoms..."
                  list="symptomsList"
                />
              </div>
              <input type="hidden" id="symptoms" name="symptoms" />
              <datalist id="symptomsList"></datalist>
              <!-- Make sure this exists in HTML -->
            </div>

            <div class="form-group">
              <label for="symptom_duration">Time Since Symptoms</label>
              <select
                class="form-control"
                id="symptom_duration"
                name="symptom_duration"
              >
                <option value="1">1 Day</option>
                <option value="2">2 Days</option>
                <option value="3">3 Days</option>
                <option value="4">4 Days</option>
                <option value="5+">5+ Days</option>
              </select>
            </div>

            <div class="form-group">
              <label for="notes">Notes</label>
              <textarea
                class="form-control"
                id="notes"
                name="notes"
                rows="4"
                placeholder="Describe your symptoms in detail..."
              ></textarea>
            </div>

            <!-- Live region: validation problems and server feedback are both
                 announced from here. The server passes a generic message only -
                 internal details are never shown to the visitor. -->
            <div
              class="form-summary"
              data-form-summary
              role="alert"
              aria-live="assertive"
              aria-atomic="true"
              {% if not message %}hidden{% endif %}
            >
              {% if message %}<p class="form-summary__title">{{ message }}</p>{% endif %}
            </div>

            <button type="submit" class="btn btn-danger btn-lg submit-btn">
              Predict
            </button>
          </form>
        </div>
      </div>
    </div>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript for Tag-based Symptoms Selection -->
    <script>
      // This is the code for the chatbot button and container
      // Function to toggle the visibility of the chatbot container
      // This function is called when the chatbot button is clicked
      function toggleChatbot() {
        const chatbot = document.getElementById("chatbotContainer");
        chatbot.style.display =
          chatbot.style.display === "block" ? "none" : "block";
      }
      // The above code is for the chatbot button and container

      document.addEventListener("DOMContentLoaded", function () {
        const symptomsList = [
          "itching",
          "skin_rash",
          "nodal_skin_eruptions",
          "continuous_sneezing",
          "shivering",
          "chills",
          "joint_pain",
          "stomach_pain",
          "acidity",
          "ulcers_on_tongue",
          "muscle_wasting",
          "vomiting",
          "burning_micturition",
          "spotting_urination",
          "fatigue",
          "weight_gain",
          "anxiety",
          "cold_hands_and_feets",
          "mood_swings",
          "weight_loss",
          "restlessness",
          "lethargy",
          "patches_in_throat",
          "irregular_sugar_level",
          "cough",
          "fever",
          "sunken_eyes",
          "breathlessness",
          "sweating",
          "dehydration",
          "indigestion",
          "headache",
          "yellowish_skin",
          "dark_urine",
          "nausea",
          "loss_of_appetite",
          "pain_behind_the_eyes",
          "back_pain",
          "constipation",
          "abdominal_pain",
          "diarrhoea",
          "mild_fever",
          "yellow_urine",
          "yellowing_of_eyes",
          "acute_liver_failure",
          "fluid_overload",
          "swelling_of_stomach",
          "swelled_lymph_nodes",
          "malaise",
          "blurred_and_distorted_vision",
          "phlegm",
          "throat_irritation",
          "redness_of_eyes",
          "sinus_pressure",
          "runny_nose",
          "congestion",
          "chest_pain",
          "weakness_in_limbs",
          "fast_heart_rate",
          "pain_during_bowel_movements",
          "pain_in_anal_region",
          "bloody_stool",
          "irritation_in_anus",
          "neck_pain",
          "dizziness",
          "cramps",
          "bruising",
          "obesity",
          "swollen_legs",
          "swollen_blood_vessels",
          "puffy_face_and_eyes",
          "enlarged_thyroid",
          "brittle_nails",
          "swollen_extremeties",
          "excessive_hunger",
          "extra_marital_contacts",
          "drying_and_tingling_lips",
          "slurred_speech",
          "knee_pain",
          "hip_joint_pain",
          "weakness",
          "stiff_neck",
          "swelling_joints",
          "movement_stiffness",
          "spinning_movements",
          "malnutrition",
          "unsteadiness",
          "weakness_of_one_body_side",
          "loss_of_smell",
          "bladder_discomfort",
          "foul_smell_of_urine",
          "continuous_feel_of_urine",
          "passage_of_gases",
          "internal_itching",
          "toxic_look_(typhos)",
          "depression",
          "irritability",
          "muscle_pain",
          "altered_sensorium",
          "red_spots_over_body",
          "belly_pain",
          "abnormal_menstruation",
          "dischromic_patches",
          "watering_from_eyes",
          "increased_appetite",
          "polyuria",
          "family_history",
          "mucoid_sputum",
          "rusty_sputum",
          "lack_of_concentration",
          "visual_disturbances",
          "receiving_blood_transfusion",
          "receiving_unsterile_injections",
          "sleep",
          "stomach_bleeding",
          "distention_of_abdomen",
          "history_of_alcohol_consumption",
          "fluid_overload.1",
          "blood_in_sputum",
          "prominent_veins_on_calf",
          "palpitations",
          "painful_walking",
          "pus_filled_pimples",
          "blackheads",
          "scurring",
          "skin_peeling",
          "silver_like_dusting",
          "small_dents_in_nails",
          "inflammatory_nails",
          "blister",
          "red_sore_around_nose",
          "yellow_crust_ooze",
        ];

        const inputField = document.getElementById("symptomsInput");
        const datalist = document.getElementById("symptomsList");
        const tagsContainer = document.getElementById("tagsContainer");
        const hiddenInput = document.getElementById("symptoms");
        const form = document.querySelector("form");

        let selectedSymptoms = [];

        // Populate the datalist
        symptomsList.forEach((symptom) => {
          let option = document.createElement("option");
          option.value = symptom;
          datalist.appendChild(option);
        });

        inputField.addEventListener("input", function () {
          let enteredValue = inputField.value.trim();
          if (
            enteredValue &&
            symptomsList.includes(enteredValue) &&
            !selectedSymptoms.includes(enteredValue)
          ) {
            addSymptom(enteredValue);
            inputField.value = ""; // Clear input
            setTimeout(() => inputField.focus(), 10); // Keep focus on input field
          }
        });

        function addSymptom(symptom) {
          if (selectedSymptoms.length >= 4) {
            inputField.disabled = true; // Disable input after 4 symptoms
            return;
          }

          selectedSymptoms.push(symptom);
          updateTags();
        }

        function updateTags() {
          tagsContainer.innerHTML = ""; // Clear existing tags

          selectedSymptoms.forEach((symptom) => {
            let tag = document.createElement("div");
            tag.className = "tag";
            tag.innerHTML = `${symptom} <span class="remove-tag">&times;</span>`;
            tag
              .querySelector(".remove-tag")
              .addEventListener("click", () => removeSymptom(symptom));
            tagsContainer.appendChild(tag);
          });

          // Add input field back if less than 4 symptoms
          if (selectedSymptoms.length < 4) {
            inputField.disabled = false;
            tagsContainer.appendChild(inputField);
          }

          // Store selected symptoms in hidden input
          hiddenInput.value = selectedSymptoms.join(",");

          // Adding a symptom clears the "select at least one" error at once.
          if (validator && selectedSymptoms.length > 0) {
            validator.clearFieldError("symptoms");
          }
        }

        function removeSymptom(symptom) {
          selectedSymptoms = selectedSymptoms.filter((s) => s !== symptom);
          inputField.disabled = false; // Enable input if symptoms are removed
          updateTags();
        }

        // Ensure form submits only if symptoms are selected
        // Inline validation instead of a browser alert. The hidden #symptoms
        // field is what the server reads; the visible tag box is marked with it
        // so the message and the highlight land next to what the visitor sees.
        const validator = window.HelloDocForms
          ? window.HelloDocForms.attach(form, {
              fields: [
                {
                  name: "symptoms",
                  label: "Symptoms",
                  alsoMarks: ["symptomsInput"],
                  rules: [
                    window.HelloDocForms.rules.required(
                      "Symptoms",
                      "type a symptom and pick it from the list — you can add up to four"
                    ),
                  ],
                },
              ],
            })
          : null;
      });
    </script>

    <!-- Shared navbar behaviour: the same scripts every other page loads. -->
    <script src="../../Scripts/appointments.js"></script>
    <script src="../../Scripts/nav.js"></script>
    <script src="../../Scripts/form-validation.js"></script>
  </body>
</html>
